automation:
  methods:
  - method: agent
    model: Libertas Superintelligence, proprietary Cognitive World Models, which construct explicit world models for the specific problem or domain being addressed
    role: 'The corpus is one stress test of the Libertas Superintelligence platform. Operating
      as a fully white-box system, the platform constructs explicit world models for the
      specific problem or domain being addressed; in this run the world model attempted to
      build a map of the path to a solution. It maps the families of approaches, narrows them
      down systematically, and carries each one end-to-end, from statement to kernel-checked
      declaration. A route that closes becomes a compiled theorem; a route that cannot close
      becomes a pruning theorem with a witness. Humans set the requirements, reviewed every
      artifact, and approved the release. Libertas Technology Group builds the platform for
      applied and industrial use in regulated sectors: biotechnology, cybersecurity,
      engineering and quantitative finance.'
status:
  scope: 'Formalized: the conjecture statement, the reduction to the A8 input, the universal
    obstruction laws listed in the README, and two infinite family closures. Not formalized:
    the conjecture itself. Two target-level inputs are stated as open definitions and carry
    no proof.'
  sorry_count: 9
  sorry_in_definitions: 0
  axioms:
  - propext
  - Classical.choice
  - Quot.sound
fidelity:
  divergences: 'The challenge module restates its vocabulary rather than importing the corpus,
    because the registry caps challenge-module imports. The statements are unchanged. The
    nine `sorry` terms counted in `status.sorry_count` are the statement placeholders in `Challenge.lean`:
    eight registered theorems and one vocabulary lemma. `Solution.lean` carries no `sorry`
    and no user axiom.'
review:
  status: self-assessed
alignment:
- theorem: ACChallenge.relationSubgroup_eq_top
  informal: A balanced presentation whose presented group is one-element has the whole free
    group as the normal closure of its relators.
- theorem: ACChallenge.expSpan_eq_top_of_presents
  informal: On that class the Z-span of the relator exponent vectors is the whole lattice
    of exponent vectors.
- theorem: ACChallenge.expMatrix_det_step
  informal: Under each of the three elementary moves the determinant of the exponent matrix
    changes by at most a sign.
- theorem: ACChallenge.reachable_powFamily
  informal: For every natural number n the pair (x times y to the n, y) reaches the standard
    pair by official moves.
- theorem: ACChallenge.expVec_conj
  informal: Conjugating a word leaves its exponent vector unchanged.
- theorem: ACChallenge.expMatrix_conj
  informal: Conjugating one relator leaves the exponent matrix unchanged.
- theorem: ACChallenge.no_strictly_decreasing_measure
  informal: At every positive rank no natural-valued function decreases on every official
    step.
- theorem: ACChallenge.stableStep_expSpan_top
  informal: Inserting or deleting an isolated generator and relator pair preserves whether
    the exponent span is the whole lattice, at every rank.
